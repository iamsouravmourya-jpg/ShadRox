      <stop stop-color="#18152c"/>
      <stop offset=".55" stop-color="#0d101a"/>
      <stop offset="1" stop-color="#080b11"/>
    </radialGradient>
    <linearGradient id="silver" x1="267" y1="212" x2="755" y2="807" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfcff"/>
      <stop offset=".25" stop-color="#cbd3e2"/>
      <stop offset=".5" stop-color="#8993aa"/>
      <stop offset=".76" stop-color="#e9eff7"/>
      <stop offset="1" stop-color="#9aaac1"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="368" y1="316" x2="633" y2="728" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b191ff"/>
      <stop offset=".28" stop-color="#8b5cf6"/>
      <stop offset=".53" stop-color="#7278ee"/>
      <stop offset=".76" stop-color="#65c9e8"/>
      <stop offset="1" stop-color="#a1edf3"/>
    </linearGradient>
    <linearGradient id="fold" x1="414" y1="449" x2="587" y2="614" gradientUnits="userSpaceOnUse">
