    <path id="shield" d="M512 157 758 263Q784 274 784 303V476C784 640 679 773 512 862 345 773 240 640 240 476V303Q240 274 266 263Z"/>
    <path id="monogram" d="M690 308H456C374 308 322 358 322 426 322 481 353 516 409 541L560 609C578 617 589 629 589 645 589 667 571 681 546 681H342L386 747H547C621 747 673 706 673 644 673 591 643 556 588 531L435 462C415 453 405 441 405 425 405 400 425 384 456 384H646Z"/>
