    <path d="M405 425C405 441 415 453 435 462L588 531C643 556 673 591 673 644 673 650 672 657 671 663 655 622 630 604 582 583L409 505C355 481 327 457 322 426 322 481 353 516 409 541L560 609C578 617 589 629 589 645 589 598 553 573 513 555L424 515C383 496 377 453 405 425Z" fill="url(#fold)" clip-path="url(#ribbonClip)"/>
