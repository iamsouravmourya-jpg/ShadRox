<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ShadRox — silver shield and spectral S</title>
  <desc id="desc">A satin-silver shield framing a folded violet and cyan S on an obsidian background.</desc>
  <defs>
